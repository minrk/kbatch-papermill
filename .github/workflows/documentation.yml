name: documentation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          pip install -e . -r docs/requirements.txt
      - name: Sphinx build
        run: |
          sphinx-build docs _build --fail-on-warning --keep-going
